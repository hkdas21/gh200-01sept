name: jobs

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔨 Simulate Build
        run: |
          echo "Building the application..."
          echo "Build completed at $(date)" > build-report.txt
          cat build-report.txt
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🧪 Simulate Tests
        run: echo "✅ All tests passed!"
